<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#3e5faf" />
  <meta name="description" content="AgentHub — ton organisation d'agents IA." />
  <title>AgentHub</title>
  <!-- Mark: an open ensō ring carrying one centre node and three agent nodes. -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'><rect width='48' height='48' rx='11' fill='%233e5faf'/><g transform='translate(24,24) scale(.74) translate(-24,-24)'><path d='M40.74 21.05A17 17 0 1 1 34.93 10.98' fill='none' stroke='%23fff' stroke-width='2.8' stroke-linecap='round'/><circle cx='24' cy='24' r='4.8' fill='%23fff'/><circle cx='24' cy='7' r='3.6' fill='%23fff'/><circle cx='38.72' cy='32.5' r='3.6' fill='%23fff'/><circle cx='9.28' cy='32.5' r='3.6' fill='%23fff'/></g></svg>" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <!-- ============================ Login ============================ -->
  <!-- Starts hidden: init() reveals either this or the app once /api/me answers,
       so an already-signed-in user never sees the login card flash by. -->
  <!-- Rempli par app.js : ouverture de compte au premier lancement, connexion ensuite. -->
  <div id="login" class="login-screen hidden">
    <form id="login-form" class="login-card" autocomplete="on"></form>
  </div>

  <!-- ============================= App ============================= -->
  <div id="app" class="app hidden">
    <aside class="sidebar" id="sidebar" aria-label="Navigation principale"></aside>
    <div class="content">
      <header class="topbar" id="topbar"></header>
      <main class="view" id="view" tabindex="-1"></main>
    </div>
  </div>

  <!-- Annonces pour lecteurs d'écran (statuts d'agents, erreurs, confirmations) -->
  <div id="live" class="sr-only" role="status" aria-live="polite" aria-atomic="false"></div>

  <!-- ======================= Command palette ======================= -->
  <div id="palette" class="palette hidden" role="dialog" aria-modal="true" aria-label="Recherche rapide">
    <div class="palette-card">
      <label for="palette-input" class="sr-only">Rechercher un agent ou un pôle</label>
      <input id="palette-input" type="text" placeholder="Rechercher un agent, un pôle…"
             role="combobox" aria-expanded="true" aria-controls="palette-results" aria-autocomplete="list" />
      <div id="palette-results" class="palette-results" role="listbox" aria-label="Résultats"></div>
    </div>
  </div>

  <!-- ============================ Modal ============================ -->
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-card">
      <div class="modal-head">
        <span id="modal-title">Titre</span>
        <button class="icon-btn" id="modal-close" type="button" aria-label="Fermer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <!-- ============================ Toasts =========================== -->
  <div id="toasts" class="toasts" aria-live="polite" aria-atomic="false"></div>

  <script src="/app.js"></script>
</body>
</html>
