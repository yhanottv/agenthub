services:
  agenthub:
    build: .
    image: agenthub:latest
    container_name: agenthub
    restart: unless-stopped
    environment:
      PORT: "8090"
      DATA_DIR: /data

      # ─── Tout ce qui suit est FACULTATIF ─────────────────────────────────
      # AgentHub démarre sans aucune configuration. Au premier accès, le site
      # te fait choisir ton mot de passe et brancher un service.
      # Ces variables ne servent qu'à pré-remplir la base au tout premier
      # démarrage, si tu préfères scripter une installation.

      HERMES_API_URL: ${HERMES_API_URL:-http://hermes-agent:8642}
      HERMES_API_KEY: ${HERMES_API_KEY:-}
      HERMES_MODEL: ${HERMES_MODEL:-hermes-agent}

      AGENTROUTER_API_URL: ${AGENTROUTER_API_URL:-}
      AGENTROUTER_API_KEY: ${AGENTROUTER_API_KEY:-}
      AGENTROUTER_MODEL: ${AGENTROUTER_MODEL:-}

      # À définir (TRUST_PROXY=1) uniquement si un reverse proxy est réellement
      # devant : sans lui, X-Forwarded-For est forgeable et le verrouillage
      # après huit tentatives ne sert plus à rien.
      TRUST_PROXY: ${TRUST_PROXY:-}

      # Où AgentHub va lire les skills Hermes, si tu montes ses dossiers
      # (voir le bloc `volumes:` plus bas). Sans ces montages, l'onglet Graph
      # le dit franchement au lieu d'afficher un catalogue vide.
      HERMES_SKILLS_DIR: ${HERMES_SKILLS_DIR:-/hermes-home/skills}
      HERMES_OPTIONAL_SKILLS_DIR: ${HERMES_OPTIONAL_SKILLS_DIR:-/hermes-src/optional-skills}

      # Laisse-les vides : le mot de passe se choisit sur le site, et le secret
      # de session est généré au premier démarrage puis conservé en base.
      # Les définir ici FIGE le mot de passe et retire la possibilité de le
      # changer depuis l'interface.
      APP_PASSWORD: ${AGENTHUB_PASSWORD:-}
      APP_SECRET: ${AGENTHUB_SECRET:-}
    volumes:
      - agenthub-data:/data

      # ─── Skills Hermes (facultatif) ───────────────────────────────────────
      # Monte les dossiers de skills d'Hermes en LECTURE SEULE : l'onglet Graph
      # affiche alors le catalogue officiel Nous Research et les skills déjà
      # actifs, sans appel réseau ni clé.
      #
      # Le nom du volume est celui d'Hermes chez toi — trouve-le avec :
      #   docker inspect <conteneur-hermes> \
      #     --format '{{range .Mounts}}{{.Name}} -> {{.Destination}}{{println}}{{end}}'
      #
      # `ro` n'est pas décoratif : AgentHub ne doit jamais écrire dans les
      # fichiers d'Hermes. Installer un skill passe par Hermes lui-même, qui
      # applique ses propres contrôles (analyse de sécurité, provenance).
      #
      # - hermes-webui-yowj_hermes-agent-src:/hermes-src:ro
      # - hermes-webui-yowj_hermes-home:/hermes-home:ro

    # Publié sur la boucle locale UNIQUEMENT, et c'est délibéré.
    #
    # Tant que personne n'a choisi de mot de passe, le premier visiteur peut le
    # faire. Avec "8090:8090", Docker ouvre ce port sur toutes les interfaces —
    # en passant devant ufw — et un scanner peut revendiquer ton instance avant
    # toi, lire tes conversations et repointer un fournisseur pour récupérer ta
    # clé API. Sur la boucle locale, cette fenêtre n'est pas joignable.
    #
    # Pour ouvrir l'interface depuis ta machine, monte un tunnel :
    #   ssh -L 8090:localhost:8090 utilisateur@ton-serveur
    # puis va sur http://localhost:8090
    #
    # Pour un accès permanent par un nom de domaine, passe par Traefik (bloc
    # plus bas) : il joint le conteneur par le réseau Docker, pas par ce port.
    ports:
      - "127.0.0.1:8090:8090"

    # ───────────────────────────────────────────────────────────────────────
    # Hermes tourne déjà quelque part ? Attache AgentHub à son réseau pour
    # qu'il puisse le joindre par son nom de conteneur, et décommente le bloc
    # `networks:` en bas du fichier :
    #
    # networks:
    #   - hermes-net
    #
    # Derrière Traefik ? Retire la section `ports:` ci-dessus — elle ne sert
    # plus à rien — mets TRUST_PROXY=1 dans ton .env, et décommente :
    #
    # labels:
    #   - traefik.enable=true
    #   - traefik.http.routers.agenthub.rule=Host(`agenthub.${TRAEFIK_HOST}`)
    #   - traefik.http.routers.agenthub.entrypoints=websecure
    #   - traefik.http.routers.agenthub.tls.certresolver=letsencrypt
    #   - traefik.http.services.agenthub.loadbalancer.server.port=8090
    # ───────────────────────────────────────────────────────────────────────

# networks:
#   hermes-net:
#     external: true
#     name: <nom-reel-du-reseau-docker-d-hermes>

volumes:
  agenthub-data:
